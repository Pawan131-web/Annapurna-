{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block auth_content %}
<div class="auth-shell">
  <div class="auth-card text-center">
    <i class="bi bi-envelope-check" style="font-size:2rem;color:var(--accent);"></i>
    <h5 class="mt-3" style="font-weight:700;">Check your inbox</h5>
    <p class="text-muted" style="font-size:.87rem;">If an account exists for that email, a reset link is on its way.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-brand w-100 mt-2">Back to sign in</a>
  </div>
</div>
{% endblock %}
