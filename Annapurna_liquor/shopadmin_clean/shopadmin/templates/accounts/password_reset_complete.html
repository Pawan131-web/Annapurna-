{% extends "base.html" %}
{% block title %}Password updated{% endblock %}
{% block auth_content %}
<div class="auth-shell">
  <div class="auth-card text-center">
    <i class="bi bi-check-circle" style="font-size:2rem;color:var(--accent);"></i>
    <h5 class="mt-3" style="font-weight:700;">Password updated</h5>
    <p class="text-muted" style="font-size:.87rem;">You can now sign in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn-brand w-100 mt-2">Sign in</a>
  </div>
</div>
{% endblock %}
