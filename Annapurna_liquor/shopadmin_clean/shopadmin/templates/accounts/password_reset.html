{% extends "base.html" %}
{% load static %}
{% block title %}Reset password · Annapurna Groceries & Liquor{% endblock %}

{% block auth_content %}
<div class="auth-split-wrapper">
  <div class="auth-card-v2" style="max-width: 440px;">
    <!-- Floating Logo Avatar -->
    <div class="auth-floating-avatar">
      <img src="{% static 'images/annapurna_logo.png' %}" alt="Annapurna Emblem">
    </div>

    <h3 class="auth-card-title text-center">Reset your password</h3>
    <p class="auth-card-subtitle text-center mb-4">Enter your registered email address and we will send you a reset link.</p>

    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="form-label" style="font-size:.85rem; font-weight:600;">Email address</label>
        <div class="input-group-custom">
          <i class="bi bi-envelope input-icon-left"></i>
          <input type="email" name="email" class="form-control-custom" placeholder="name@example.com" required autofocus>
        </div>
      </div>
      <button type="submit" class="btn btn-emerald-primary w-100 mb-3">
        Send reset link
      </button>
    </form>
    
    <div class="text-center mt-3">
      <a href="{% url 'accounts:login' %}" class="auth-link-forgot">
        <i class="bi bi-arrow-left me-1"></i>Back to sign in
      </a>
    </div>
  </div>
</div>
{% endblock %}
