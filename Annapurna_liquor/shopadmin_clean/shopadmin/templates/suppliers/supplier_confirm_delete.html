{% extends "base.html" %}
{% block title %}Delete Supplier{% endblock %}
{% block page_title %}Delete Supplier{% endblock %}
{% block content %}
<div class="section-card" style="max-width:480px;">
  <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{% url 'suppliers:list' %}" class="btn btn-outline-brand">Cancel</a>
  </form>
</div>
{% endblock %}
